          feedback_not_for_me: "Sugerencias marcadas como no adecuadas"
        support_title: "Investiga con cuidado"
        support_body: "Ante una inquietud sobre privacidad, abuso o el mercado, comienza con el registro administrativo y el identificador de cuenta recibido por tu proceso de soporte. Confirma el alcance con el titular antes de pedir más contexto. Conserva la evidencia de auditoría y deriva las inquietudes a revisión humana."
        scope: "El registro muestra metadatos limitados de cuentas y acciones bajo su propia política administrativa. Este resumen excluye contenido de relaciones, datos de trabajos y credenciales. Los cambios de funciones usan su proceso de mantenimiento auditado existente; publicar en el catálogo requiere mantenimiento autorizado. Aquí no hay suplantación, suspensión de cuentas ni acciones de moderación."
        trust_audit: "Revisar aperturas de bóveda fallidas de hoy"
