        no_waiting: "Ninguna pendiente"
        queue_unavailable: "No se pudo consultar el almacenamiento de trabajos. Revisa la conexión y las migraciones de la base de datos de colas con el equipo de operaciones. La falta de datos no significa que no haya trabajos fallidos."
        sections:
          accounts: "Cuentas y funciones"
          approvals: "Aprobaciones pendientes"
          integrations: "Recuperación de integraciones"
          queue: "Supervisión de trabajos"
          jobs: "Observaciones de la cola"
          trust: "Señales de confianza y comentarios"
        guidance:
          accounts: "Cada usuario representa una cuenta. Las funciones habilitadas son indicadores activos con su valor global encendido; las asignaciones pueden modificarlo. Los recuentos de publicaciones describen la visibilidad del catálogo."
          approvals: "Solo solicitudes guardadas; consultar no descubre trabajo nuevo. Los aplazamientos vencidos cuentan como pendientes. Pide al titular que revise su cola; soporte no puede aprobar en su nombre."
          integrations: "Estado guardado de las conexiones, no disponibilidad del proveedor en tiempo real. Los titulares reconectan, revisan permisos, reintentan la sincronización o completan la limpieza de credenciales en sus ajustes. Los permisos temporales de sincronización vencidos pueden indicar trabajo interrumpido."
          jobs: "Los recuentos provienen de Solid Queue. Los procesos recientes han informado en los últimos cinco minutos; cero indica que no se observó actividad reciente. Pide a operaciones que revise los procesos y diagnósticos sin datos privados antes de considerar un reintento. Esta página no reintenta ni descarta trabajos."
          trust: "Los intentos fallidos de apertura cubren las últimas 24 horas. Los comentarios sobre sugerencias incluyen todos los registros conservados. Estas señales no son conclusiones de abuso ni una cola de moderación."
