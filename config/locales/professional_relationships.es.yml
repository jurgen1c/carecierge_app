es:
  professional_relationships:
    stale_context: "El modo de la relación cambió. Revisa el contexto actual antes de intentarlo de nuevo."
    stale_draft: "El modo de relación cambió en otra pestaña. Recarga el perfil y revisa el borrador antes de intentarlo de nuevo."
    title: Relación profesional
    hint: Mantén separado el contexto laboral. Solo los registros laborales que selecciones
      se usan en borradores, resúmenes y sugerencias profesionales. Se excluyen las
      notas personales y el contenido de la bóveda.
    mode: Modo de relación
    modes:
      personal: Personal
      professional: Profesional
    edit_context: Editar contexto y fuentes laborales
    fields:
      organization: Organización
      role: Cargo y contexto de las partes interesadas
      goals: Objetivos laborales
      communication_preferences: Preferencias de comunicación
      boundaries: Límites laborales y política de regalos
      review_preparation: Preparación para la evaluación de desempeño
    gifts_allowed: Los regalos o gestos son apropiados para esta relación laboral
      según la política y los límites que registré.
    gifts_enabled: Las ideas de regalos profesionales están habilitadas. Revisa cada
      idea según los límites registrados.
    gifts_disabled: Las ideas de regalos están desactivadas hasta que confirmes que
      son apropiadas en el contexto laboral.
    sources_title: Elegir registros laborales
    sources_hint: Selecciona hasta seis registros por categoría. Crea o edita notas,
      compromisos, preferencias, hitos, regalos, planes y recordatorios en sus espacios habituales, guárdalos
      y selecciónalos aquí. Los registros seleccionados se mantienen actualizados;
      no puedes seleccionar notas privadas o protegidas en la bóveda. Se muestran
      los 100 registros más recientes y las selecciones existentes.
    control_sources_hint: Los planes, recordatorios, cajas de regalo, proveedores y comparaciones seleccionados se pueden gestionar en el chat. Su contenido y sus registros relacionados no se incorporan automáticamente a borradores, resúmenes u otras sugerencias generadas. La selección de proveedores se aplica solo a esta relación.
    empty_sources: Aún no hay registros disponibles. Guarda el perfil, agrega un registro
      en su sección y vuelve para seleccionarlo.
    collections:
      relationship_notes: Notas de reuniones
      relationship_preferences: Preferencias de las partes interesadas
      commitments: Compromisos y seguimientos
      important_dates: Hitos de clientes
      gifts: Historial de regalos profesionales
      event_plans: Planes laborales
      reminders: Recordatorios laborales
      gift_boxes: Cajas de regalo laborales
      vendors: Proveedores laborales guardados
      vendor_shortlists: Comparaciones laborales de proveedores
    actions: Preparación profesional
    meeting_notes: Escribir notas de reuniones
    follow_ups: Registrar compromisos y seguimientos
    milestones: Agregar hitos de clientes
    review: Preparar una reunión o evaluación de desempeño
    source_label: Contexto laboral seleccionado
