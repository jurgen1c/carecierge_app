  activerecord:
    models:
      social_context_note: "Social context note"
    attributes:
      social_context_note:
        body: "Note or screenshots"
        interpretation: "Interpretation"
        allow_suggestions: "Use in suggestions and message drafts"
        suggested_uses: "Suggested uses"
    errors:
      models:
        social_context_note:
          attributes:
            body:
              too_many_attachments: "can include at most %{count} screenshots"
              unsupported_attachment: "can include only PNG, JPEG, or WebP screenshots"
              attachment_too_large: "includes a screenshot larger than %{count} bytes"
              html_too_large: "contains more than %{count} bytes of formatted content"
              unmanaged_image: "can include only screenshots uploaded through the editor"
