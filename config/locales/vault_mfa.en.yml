en:
  vault_mfa:
    title: "Vault security"
    back: "Back to your day"
    boundary: "You are signed in to Carecierge. Vault security adds an authenticator check when you unlock private relationship information; it does not change ordinary sign-in."
    password: "Carecierge password"
    totp: "Authenticator code"
    code: "Authenticator or recovery code"
    export_help: "Including sensitive information requires your password and a fresh authenticator code or one unused recovery code. Leave the code blank for exports without sensitive information."
    display_timeout: "For your privacy, this page hides the codes within 10 minutes, or sooner if setup expires or you sign out."
    start_title: "Add an authenticator"
    start_body: "Confirm your password, connect an authenticator app, then save your recovery codes. Setup expires after 10 minutes. If you leave before finishing, start again."
    start: "Start setup"
    scan_title: "Connect your authenticator"
    scan_body: "Scan this QR code in your authenticator app, then enter its six-digit code."
    qr_alt: "Authenticator setup QR code; the manual setup key follows."
    manual_key: "Or enter this key manually:"
    verify: "Verify authenticator"
    retry_title: "Enter a fresh authenticator code"
    retry_body: "Use the authenticator you just connected. If its code changed, enter the new six-digit code."
    restart: "Start setup again"
    recovery_title: "Save your recovery codes"
    recovery_body: "These 10 codes appear only now. Save them somewhere safe outside Carecierge. Each code works once with your password. A new set replaces every previous code. If you lose this page during setup, start again."
    acknowledged: "I saved my recovery codes in a safe place."
    finish: "Enable vault MFA"
    saved: "I saved these codes"
    enrolled: "Authenticator security is enabled. Unlock the vault again with both factors."
    enabled_title: "Authenticator security is enabled"
    remaining:
      one: "%{count} recovery code remains."
      other: "%{count} recovery codes remain."
    regenerate: "Replace recovery codes"
    regenerate_body: "Enter your password and a fresh authenticator code. All previous recovery codes will stop working, and your vault will lock. Wait for the next code if you just used the current one."
    disable: "Disable vault MFA"
    disable_body: "Confirm your password and a fresh authenticator or recovery code. Your vault will lock, then return to password-only protection."
    disabled: "Authenticator security is disabled. Your vault still requires your password."
    unlock_body: "This vault also requires a fresh authenticator code or one unused recovery code. Wait for the next code if you just used the current one."
    lost_title: "Lost your authenticator?"
    lost_body: "Use your Carecierge password and one unused recovery code to unlock the vault or disable MFA here. To connect a replacement device, disable MFA with a recovery code, then enroll the new authenticator."
    no_recovery: "Without your authenticator or an unused recovery code, the vault remains locked. Password reset, ordinary sign-in, and support cannot bypass MFA. You can continue using the rest of Carecierge."
    password_prerequisite: "If you joined with Google or do not know your Carecierge password, establish a password through password recovery before setup or lost-device recovery. Resetting your password keeps MFA enabled."
    reset_password: "Sign out and set or reset my password"
    errors:
      invalid: "Verification was not accepted. Check your password and use a fresh code."
      rate_limited: "Too many attempts. Wait five minutes before trying again."
      expired: "This setup step expired or was already used. Start setup again with your password."
      already_enabled: "Authenticator security is already enabled."
      not_enabled: "Authenticator security is not enabled."
      acknowledgement_required: "Confirm that you saved your recovery codes. If you did not save them, start setup again."
  audit_events:
    actions:
      privacy_vault_mfa_enrolled:
        title: "Vault MFA enabled"
        description: "Authenticator security was enabled for your vault."
      privacy_vault_mfa_verified:
        title: "Vault second factor verified"
        description: "An authenticator or recovery verification succeeded."
      privacy_vault_mfa_verification_failed:
        title: "Vault verification failed"
        description: "A vault security verification was rejected."
      privacy_vault_recovery_used:
        title: "Vault recovery code used"
        description: "One recovery code was consumed."
      privacy_vault_mfa_disabled:
        title: "Vault MFA disabled"
        description: "Authenticator security was disabled after verification."
      privacy_vault_recovery_regenerated:
        title: "Vault recovery codes replaced"
        description: "A new set replaced the previous recovery codes."
