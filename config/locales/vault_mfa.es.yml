es:
  vault_mfa:
    display_timeout: "Por tu privacidad, esta página oculta los códigos en un máximo de 10 minutos, o antes si vence la configuración o cierras sesión."
    export_help: "Incluir información sensible requiere tu contraseña y un código nuevo del autenticador o un código de recuperación sin usar. Deja el código vacío para exportaciones sin información sensible."
    title: "Seguridad de la bóveda"
    back: "Volver a tu día"
    boundary: "Ya iniciaste sesión en Carecierge. La seguridad de la bóveda agrega una verificación con una app de autenticación al abrir información privada; no cambia el inicio de sesión habitual."
    password: "Contraseña de Carecierge"
    totp: "Código de autenticación"
    code: "Código de autenticación o recuperación"
    start_title: "Agregar una app de autenticación"
    start_body: "Confirma tu contraseña, conecta una app de autenticación y guarda tus códigos de recuperación. La configuración vence en 10 minutos. Si sales antes de terminar, comienza de nuevo."
    start: "Comenzar configuración"
    scan_title: "Conecta tu app de autenticación"
    scan_body: "Escanea este código QR en tu app de autenticación e ingresa su código de seis dígitos."
    qr_alt: "Código QR para configurar la autenticación; la clave manual aparece a continuación."
    manual_key: "O ingresa esta clave manualmente:"
    verify: "Verificar autenticación"
    retry_title: "Ingresa un código nuevo de autenticación"
    retry_body: "Usa la app que acabas de conectar. Si su código cambió, ingresa el nuevo código de seis dígitos."
    restart: "Comenzar la configuración de nuevo"
    recovery_title: "Guarda tus códigos de recuperación"
    recovery_body: "Estos 10 códigos se muestran solo ahora. Guárdalos en un lugar seguro fuera de Carecierge. Cada código funciona una vez junto con tu contraseña. Un conjunto nuevo reemplaza todos los anteriores. Si pierdes esta página durante la configuración, comienza de nuevo."
    acknowledged: "Guardé mis códigos de recuperación en un lugar seguro."
    finish: "Activar MFA de la bóveda"
    saved: "Guardé estos códigos"
    enrolled: "La autenticación adicional está activada. Abre la bóveda de nuevo con ambos factores."
    enabled_title: "La autenticación adicional está activada"
    remaining:
      one: "Queda %{count} código de recuperación."
      other: "Quedan %{count} códigos de recuperación."
    regenerate: "Reemplazar códigos de recuperación"
    regenerate_body: "Ingresa tu contraseña y un código nuevo de autenticación. Todos los códigos de recuperación anteriores dejarán de funcionar y la bóveda se bloqueará. Espera el siguiente código si acabas de usar el actual."
    disable: "Desactivar MFA de la bóveda"
    disable_body: "Confirma tu contraseña y un código nuevo de autenticación o recuperación. La bóveda se bloqueará y volverá a estar protegida solo por contraseña."
    disabled: "La autenticación adicional está desactivada. La bóveda todavía requiere tu contraseña."
    unlock_body: "Esta bóveda también requiere un código nuevo de autenticación o un código de recuperación sin usar. Espera el siguiente código si acabas de usar el actual."
    lost_title: "¿Perdiste tu app de autenticación?"
    lost_body: "Usa tu contraseña de Carecierge y un código de recuperación sin usar para abrir la bóveda o desactivar MFA aquí. Para conectar otro dispositivo, desactiva MFA con un código de recuperación y configura la nueva app."
    no_recovery: "Sin tu app de autenticación ni un código de recuperación sin usar, la bóveda permanece bloqueada. Restablecer la contraseña, iniciar sesión o contactar a soporte no permite omitir MFA. Puedes seguir usando el resto de Carecierge."
    password_prerequisite: "Si te registraste con Google o no conoces tu contraseña de Carecierge, establece una mediante la recuperación de contraseña antes de configurar MFA o recuperar el acceso. Restablecer tu contraseña mantiene MFA activado."
    reset_password: "Cerrar sesión y establecer o restablecer mi contraseña"
    errors:
      invalid: "No se aceptó la verificación. Revisa tu contraseña y usa un código nuevo."
      rate_limited: "Demasiados intentos. Espera cinco minutos antes de intentar de nuevo."
      expired: "Este paso venció o ya se usó. Comienza la configuración de nuevo con tu contraseña."
      already_enabled: "La autenticación adicional ya está activada."
      not_enabled: "La autenticación adicional no está activada."
      acknowledgement_required: "Confirma que guardaste tus códigos. Si no los guardaste, comienza la configuración de nuevo."
  audit_events:
    actions:
      privacy_vault_mfa_enrolled:
        title: "MFA de la bóveda activado"
        description: "Se activó la autenticación adicional para tu bóveda."
      privacy_vault_mfa_verified:
        title: "Segundo factor verificado"
        description: "Se verificó un código de autenticación o recuperación."
      privacy_vault_mfa_verification_failed:
        title: "Verificación de la bóveda fallida"
        description: "Se rechazó una verificación de seguridad de la bóveda."
      privacy_vault_recovery_used:
        title: "Código de recuperación usado"
        description: "Se consumió un código de recuperación."
      privacy_vault_mfa_disabled:
        title: "MFA de la bóveda desactivado"
        description: "Se desactivó la autenticación adicional después de verificar."
      privacy_vault_recovery_regenerated:
        title: "Códigos de recuperación reemplazados"
        description: "Un conjunto nuevo reemplazó los códigos anteriores."
