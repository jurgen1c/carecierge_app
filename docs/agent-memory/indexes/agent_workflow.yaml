id: agent_workflow
name: Agent Workflow
summary: Repository agent instructions, durable memory workflow, key dependency list, frontend policy, and source-of-truth files for agent behavior.
claim_globs:
  - claims/agent_workflow/**/*.md
default_queries:
  - shared workspace navigation locale Today People profile sections pagination
  - agent workflow frontend policy
  - product design source of truth
  - style variants helper
  - project dependency list
  - local CI signoff gate
  - data backfills data_migrate
  - development seed synthetic journeys
watched_files:
  - app/views/layouts/application.html.erb
  - app/views/components/app_navigation_component.*
  - app/views/components/action_link_component.*
  - app/views/components/page_header_component.*
  - app/views/components/person_identity_component.*
  - app/views/components/date_marker_component.*
  - app/views/components/form_heading_component.*
  - app/views/components/ui_icon_component.*
  - app/assets/stylesheets/application.tailwind.css
  - app/javascript/controllers/app_menu_controller.js
  - spec/system/workspace_experience_spec.rb
  - spec/components/workspace_primitives_spec.rb
  - spec/components/previews/workspace_preview.rb
  - .impeccable/design.json
  - lib/development_seeds/**/*.rb
  - lib/tasks/development.rake
  - db/seeds.rb
  - db/seeds/**/*.rb
  - docs/development/journeys.md
  - AGENTS.md
  - config/ci.rb
  - bin/setup
  - eslint.config.mjs
  - db/data/**/*.rb
  - db/migrate/**/*.rb
  - PRODUCT.md
  - DESIGN.md
  - package.json
  - bun.lock
  - bin/memory
  - agent-memory.config.yaml
  - .tool-versions
  - app/helpers/style_variants_helper.rb
  - .impeccable/live/config.json
tags:
  - agent_workflow
  - frontend
  - design-system
  - ci
  - signoff
  - data_migrate
  - migrations
