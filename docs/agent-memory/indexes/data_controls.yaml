id: data_controls
name: Data Controls
summary: Owner-scoped account portability, including manual vendor quotes, protected export boundaries, and privacy-minimized permanent deletion.
claim_globs:
  - claims/data_controls/**/*.md
default_queries:
  - data export JSON CSV PDF calendar protected vault password
  - delete account profile sensitive note AI generated data
  - social context export screenshot deletion blob cleanup
  - social context abandoned upload cleanup owner metadata foreign key
  - deletion request account digest audit evidence
  - event plans plan tasks AI suggestions export selective deletion reminder preservation
  - vendor quote export decrypted scope notes vendor provenance account plan deletion
watched_files:
  - app/controllers/data_controls_controller.rb
  - app/controllers/data_exports_controller.rb
  - app/controllers/data_deletions_controller.rb
  - app/controllers/users/registrations_controller.rb
  - app/controllers/direct_uploads_controller.rb
  - app/controllers/social_context_screenshots_controller.rb
  - app/jobs/purge_abandoned_social_context_upload_job.rb
  - app/controllers/privacy_vault_items_controller.rb
  - app/controllers/relationship_profiles_controller.rb
  - app/models/deletion_request.rb
  - app/models/feed_item_state.rb
  - app/models/social_context_note.rb
  - app/models/user.rb
  - app/models/vendor_quote.rb
  - app/policies/data_control_policy.rb
  - app/serializers/data_exports/**/*.rb
  - app/services/data_deletions/**/*.rb
  - app/services/privacy_vault/delete.rb
  - app/views/data_controls/**/*.erb
  - app/views/data_exports/**/*.erb
  - app/views/privacy_vaults/show.html.erb
  - config/routes.rb
  - config/locales/en.yml
  - config/locales/es.yml
  - config/initializers/filter_parameter_logging.rb
  - db/migrate/*deletion_requests*.rb
  - db/migrate/*feed_item_states*.rb
  - db/migrate/*social_context*.rb
  - db/migrate/*event_plans*.rb
  - db/migrate/*vendor_quotes*.rb
  - docs/features/10-05-data-export-and-deletion.md
  - spec/requests/data_controls_spec.rb
  - spec/system/data_controls_spec.rb
  - spec/serializers/data_exports/snapshot_spec.rb
tags:
  - data_controls
  - privacy
  - export
  - deletion
