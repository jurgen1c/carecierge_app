id: data_controls
name: Data Controls
summary: Owner-scoped account portability, protected export boundaries, and privacy-minimized permanent deletion.
claim_globs:
  - claims/data_controls/**/*.md
default_queries:
  - data export JSON CSV PDF calendar protected vault password
  - delete account profile sensitive note AI generated data
  - deletion request account digest audit evidence
watched_files:
  - app/controllers/data_controls_controller.rb
  - app/controllers/data_exports_controller.rb
  - app/controllers/data_deletions_controller.rb
  - app/controllers/privacy_vault_items_controller.rb
  - app/controllers/relationship_profiles_controller.rb
  - app/models/deletion_request.rb
  - app/models/user.rb
  - app/policies/data_control_policy.rb
  - app/serializers/data_exports/**/*.rb
  - app/services/data_deletions/**/*.rb
  - app/services/privacy_vault/delete.rb
  - app/views/data_controls/**/*.erb
  - app/views/data_exports/**/*.erb
  - app/views/privacy_vaults/show.html.erb
  - config/routes.rb
  - config/locales/en.yml
  - config/locales/es.yml
  - config/initializers/filter_parameter_logging.rb
  - db/migrate/*deletion_requests*.rb
  - docs/features/10-05-data-export-and-deletion.md
  - spec/requests/data_controls_spec.rb
  - spec/system/data_controls_spec.rb
tags:
  - data_controls
  - privacy
  - export
  - deletion
