id: event_plans
name: Event Plans
summary: Owner-scoped relationship event plans with deterministic templates, user-controlled source-backed suggestions and recovery options, reminder reuse, and manual vendor quote comparison.
claim_globs:
  - claims/event_plans/**/*.md
default_queries:
  - event plan birthday anniversary generic occasion template task phase progress
  - birthday important date prefill next occurrence next action gift message backup review only
  - anniversary milestone important date tone effort prior year history confirm reservation activity flowers personal touch
  - event plan AI suggestion source provenance private note privacy vault lease
  - event plan reminder scheduling completion archive selective AI deletion export
  - personal touch checklist event plan important date birthday anniversary preference provenance reorder dismiss
  - backup plan recovery weather vendor gift delay restaurant transportation cancellation compare promote supersede
  - event plan vendor quote comparison deadline reminder completed archived read only
watched_files:
  - app/controllers/event_plans_controller.rb
  - app/javascript/controllers/event_plan_form_controller.js
  - app/controllers/plan_tasks_controller.rb
  - app/controllers/personal_touch_checklists_controller.rb
  - app/controllers/personal_touch_items_controller.rb
  - app/controllers/backup_plans_controller.rb
  - app/controllers/vendor_quotes_controller.rb
  - app/models/backup_plan.rb
  - app/models/backup_option.rb
  - app/models/event_plan.rb
  - app/models/plan_task.rb
  - app/models/personal_touch_checklist.rb
  - app/models/personal_touch_item.rb
  - app/models/vendor_quote.rb
  - app/policies/event_plan_policy.rb
  - app/policies/plan_task_policy.rb
  - app/policies/personal_touch_checklist_policy.rb
  - app/policies/personal_touch_item_policy.rb
  - app/queries/event_plans/prior_anniversary_plans.rb
  - app/services/event_plans/**/*.rb
  - app/agents/event_plans/**/*.rb
  - app/services/personal_touch_checklists/**/*.rb
  - app/services/backup_plans/**/*.rb
  - app/agents/backup_plans/**/*.rb
  - app/views/event_plans/**/*.erb
  - app/views/important_dates/_important_date.html.erb
  - app/views/important_dates/_section.html.erb
  - app/views/important_dates/_upcoming.html.erb
  - app/views/components/event_plan_workspace_component.*
  - app/views/components/personal_touch_checklist_component.*
  - app/views/components/vendor_quote_comparison_component.*
  - app/views/vendor_quotes/**/*.erb
