id: relationship_profiles
name: Relationship Profiles
summary: Authenticated, user-owned relationship profile CRUD with localized and searchable namespaced STI-backed relationship type labels, JSONB-backed profile attributes for custom type metadata, sanitized discriminator params, contact details, Lexxy/Action Text rich notes, manually supplied and review-gated social context, an encrypted password-gated privacy vault, associated structured preference metadata, evidence-backed relationship personas with explicit uncertainty, deterministic source-backed suggestions with user feedback and reminder-only actions, private review-only AI message drafts with explicitly gated sensitive context and immutable revision history, structured owner-scoped relationship-memory search with source, relationship, archive-status, and date filters, memory records with confidence/source/review metadata and automation guardrails, conversation recaps with asynchronous source-backed and owner-reviewed AI memory extraction, observation-first mood notes with follow-up intent, suggested contact cadence and manual or source-derived interaction history, promises and commitments with reminder and timeline integration, relationship timeline entries, relationship-type template fields, custom field values, important dates and milestones, desires and future ideas with fulfillment history, gift history and reactions, rich private notes, reusable tags, relationship groups, friendly slugs, discard-backed archive state, search, and filtering.
claim_globs:
  - claims/relationship_profiles/**/*.md
default_queries:
  - relationship profile owner scoped CRUD
  - relationship profiles search filter archive
  - relationship memory search structured source relationship archive date vault exclusion instrumentation
  - contact details rich private notes structured preferences preference metadata
  - preference type category confidence learned date source notes
  - memory records source confidence status stale review automation approval revisions
  - relationship persona confirmed inferred evidence title correction suggestion inputs vault consent
  - suggestion engine explanations feedback dismissal act reminder action kind automation permission
  - message drafts response suggestions situation purpose tone length formality private notes vault lease immutable revisions review only OpenAI
  - social context user provided screenshots analysis permission interpretation review consent suggestions message drafts
  - social context direct upload abandoned cleanup authorized bounded preview owner column
  - privacy vault encryption password reauthentication access lease audit suggestion exclusion
  - conversation recaps timeline source links AI extraction approval gate
  - extracted memory proposals source excerpts confidence owner approval correction rejection OpenAI
  - mood notes observations supportive actions follow-up reminders timeline visibility
  - contact cadence suggested intervals meaningful interactions derived sources overdue prompts
  - timeline entries relationship history manual system source record filtering
  - promises commitments due dates overdue statuses reminders timeline source record
  - relationship type template fields custom field values
  - custom relationship type label profile attributes store accessor
  - important dates milestones recurrence planning prompts
  - desires wants future ideas fulfillment history suggestion contexts
  - gift history reactions vendors outcomes duplicate recommendation guardrails
  - independently managed gifts profile saves validation boundary
  - reusable relationship tags groups filtering
  - Lexxy Action Text relationship notes
