id: ui_workspace_shared_view_composition
status: active
reason: >
  The shared-shell, locale, profile-workspace and Today claims own this UI change.
  These reviewed cross-system files only adopt the layout-owned main landmark,
  local reading measures, shared headings and error semantics, uniquely labeled
  responsive filters, or updated navigation/Spanish-path expectations.
  Existing admin aggregate-only authority, approval synchronization, vendor
  publication, shared consent, provider/manual-action and source lifecycles
  remain current. Their atomic domain claims do not need replacement for this
  composition change. Full RSpec and the bilingual browser matrix verify the
  integration; tmp/ui-improvements/review records the review evidence.
  The family browser test waits for visible Turbo save results before filtering;
  this corrects test synchronization without changing family ownership or RSVP rules.
